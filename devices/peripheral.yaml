uart:
  namespace: uart

  options:
    - name: BaudRate
      kind: value
      type: std::uint32_t
      tag: BaudRate
      default: 115200

    - name: DataBits
      kind: value
      type: std::uint8_t
      tag: DataBits
      default: 8

    - name: StopBits
      kind: value
      type: auto
      tag: StopBits
      default: 1

    - name: parity
      kind: enum
      tag: Parity
      option_values:
        - None
        - Even
        - Odd

    - name: direction
      kind: enum
      tag: Direction
      option_values:
        - Tx
        - Rx
        - TxRx

    - name: flow_control
      kind: enum
      tag: FlowControl
      option_values:
        - None
        - Rts
        - Cts
        - RtsCts

    - name: Events
      kind: varargs
      tag: Events

spi:
  namespace: spi

  options:
    - name: direction
      kind: enum
      tag: Direction
      option_values:
        - FullDuplex
        - TransmitOnly
        - ReceiveOnly
        - HalfDuplexTransmit
        - HalfDuplexReceive

    - name: Baud
      kind: value
      type: std::uint32_t
      tag: Baud
      default: 9_MHz

    - name: DataBits
      kind: value
      type: std::uint8_t
      tag: DataBits
      default: 8

    - name: mode
      kind: enum
      tag: Mode
      option_values:
        - Master
        - Slave

    - name: clock_polarity
      kind: enum
      tag: ClockPolarity
      option_values:
        - Low
        - High

    - name: clock_phase
      kind: enum
      tag: ClockPhase
      option_values:
        - FirstEdge
        - SecondEdge

    - name: bit_order
      kind: enum
      tag: BitOrder
      option_values:
        - MSBFirst
        - LSBFirst

    - name: Events
      kind: varargs
      tag: Events

i2c:
  namespace: i2c

  options:
    - name: Frequency
      kind: value
      type: std::uint32_t
      tag: Frequency
      default: 400_kHz

    - name: Timeout
      kind: value
      type: std::uint32_t
      tag: Timeout
      default: 10

    - name: Events
      kind: varargs
      tag: Events

timer:
  namespace: timer
  
  options:
    - name: Frequency
      kind: value
      type: std::uint32_t
      tag: Frequency
      default: 1_MHz

    - name: AutoPeriod
      kind: bool
      tag: AutoPeriod

    - name: Channel
      kind: value
      type: std::uint32_t
      tag: Channel
      default: 1

    - name: Initial
      kind: value
      type: std::uint32_t
      tag: Initial
      default: 50

    - name: polarity
      kind: enum
      tag: polarity
      option_values:
        - ActiveHigh
        - ActiveLow

    - name: mode
      kind: enum
      tag: mode
      option_values:
        - name: Output
          allowed_options:
            - Channel
            - Initial
            - polarity
            - output_compare_mode
        - name: Input
          allowed_options:
            - Channel
            - polarity
            - input_mapping
            - input_capture_prescaler

    - name: output_compare_mode
      kind: enum
      tag: output_compare_mode
      option_values:
        - Frozen
        - Active
        - Inactive
        - Toggle
        - PwmActiveHigh
        - PwmActiveLow

    - name: input_mapping
      kind: enum
      tag: input_mapping
      option_values:
        - Direct
        - Indirect
        - TRC

    - name: input_capture_prescaler
      kind: enum
      tag: input_capture_prescaler
      option_values:
        - EveryValidEdge
        - Every2ndEdge
        - Every4thEdge
        - Every8thEdge

    - name: input_capture_filter
      kind: enum
      tag: input_capture_filter
      option_values:
        - NoFilter       # No filter, sampling at fDTS
        - FCKInt2        # fSAMPLING = fCK_INT, N = 2
        - FCKInt4        # fSAMPLING = fCK_INT, N = 4
        - FCKInt8        # fSAMPLING = fCK_INT, N = 8
        - FDTS2_N6       # fSAMPLING = fDTS / 2, N = 6
        - FDTS2_N8       # fSAMPLING = fDTS / 2, N = 8
        - FDTS4_N6       # fSAMPLING = fDTS / 4, N = 6
        - FDTS4_N8       # fSAMPLING = fDTS / 4, N = 8
        - FDTS8_N6       # fSAMPLING = fDTS / 8, N = 6
        - FDTS8_N8       # fSAMPLING = fDTS / 8, N = 8
        - FDTS16_N5      # fSAMPLING = fDTS / 16, N = 5
        - FDTS16_N6      # fSAMPLING = fDTS / 16, N = 6
        - FDTS16_N8      # fSAMPLING = fDTS / 16, N = 8
        - FDTS32_N5      # fSAMPLING = fDTS / 32, N = 5
        - FDTS32_N6      # fSAMPLING = fDTS / 32, N = 6
        - FDTS32_N8      # fSAMPLING = fDTS / 32, N = 8

    - name: Events
      kind: varargs
      tag: Events