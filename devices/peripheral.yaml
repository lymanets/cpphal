uart:
  namespace: uart

  options:
    - name: BaudRate
      kind: value
      type: std::uint32_t
      tag: BaudRate
      default: 115200

    - name: DataBits
      kind: value
      type: std::uint8_t
      tag: DataBits
      default: 8

    - name: StopBits
      kind: value
      type: auto
      tag: StopBits
      default: 1

    - name: parity
      kind: enum
      tag: Parity
      option_values:
        - None
        - Even
        - Odd

    - name: direction
      kind: enum
      tag: Direction
      option_values:
        - Tx
        - Rx
        - TxRx

    - name: flow_control
      kind: enum
      tag: FlowControl
      option_values:
        - None
        - Rts
        - Cts
        - RtsCts

    - name: Events
      kind: varargs
      tag: Events

spi:
  namespace: spi

  options:
    - name: direction
      kind: enum
      tag: Direction
      option_values:
        - FullDuplex
        - TransmitOnly
        - ReceiveOnly
        - HalfDuplexTransmit
        - HalfDuplexReceive

    - name: Baud
      kind: value
      type: std::uint32_t
      tag: Baud
      default: 9_MHz

    - name: DataBits
      kind: value
      type: std::uint8_t
      tag: DataBits
      default: 8

    - name: mode
      kind: enum
      tag: Mode
      option_values:
        - Master
        - Slave

    - name: clock_polarity
      kind: enum
      tag: ClockPolarity
      option_values:
        - Low
        - High

    - name: clock_phase
      kind: enum
      tag: ClockPhase
      option_values:
        - FirstEdge
        - SecondEdge

    - name: bit_order
      kind: enum
      tag: BitOrder
      option_values:
        - MSBFirst
        - LSBFirst

    - name: Events
      kind: varargs
      tag: Events

i2c:
  namespace: i2c

  options:
    - name: Frequency
      kind: value
      type: std::uint32_t
      tag: Frequency
      default: 400_kHz

    - name: Timeout
      kind: value
      type: std::uint32_t
      tag: Timeout
      default: 10

    - name: Events
      kind: varargs
      tag: Events

timer:
  namespace: timer
  
  options:
    - name: Frequency
      kind: value
      type: std::uint32_t
      tag: Frequency
      default: 1_MHz

    - name: AutoPeriod
      kind: bool
      tag: AutoPeriod

    - name: Channel
      kind: value
      type: std::uint32_t
      tag: Channel
      default: 1

    - name: Initial
      kind: value
      type: std::uint32_t
      tag: Initial
      default: 50

    - name: polarity
      kind: enum
      tag: polarity
      option_values:
        - ActiveHigh
        - ActiveLow

    - name: output_compare_mode
      kind: enum
      tag: output_compare_mode
      option_values:
        - Frozen
        - Active
        - Inactive
        - Toggle
        - PwmActiveHigh
        - PwmActiveLow

    - name: Events
      kind: varargs
      tag: Events